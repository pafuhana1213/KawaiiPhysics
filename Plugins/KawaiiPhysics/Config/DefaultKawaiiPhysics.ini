[CoreRedirects]
; ProceduralWind パラメータ系列リネーム（v1.21.0 開発中の変更）。旧名はチェーンさせず最終名へ直接リダイレクトする:
;   Oscillation/Pulse -> Sway / Steady -> Constant / Wave -> Ripple / Envelope/Breathing -> StrengthCycle
;   DirectionNoise -> WindDirectionNoise / RandomPeriod -> RandomForcePeriod / RandomSeed -> Seed
; EnvelopeFrequency (Hz) -> StrengthCyclePeriod (秒) は単位が変わるため意図的にリダイレクトしない。
; 旧アセットの値は破棄され既定値へフォールバックする。
; bOverrideEnvelopeFrequency も同様にリダイレクトしない（フラグだけ移送すると既定 Period を強制上書きしてしまうため）。
; EnvelopeMin/Max・BreathingMin/Max は後続タスクで FFloatInterval へ統合され消えるため、意図的にリダイレクトしない。
; FKawaiiPhysics_ExternalForce_ProceduralWind
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.OscillationForce",NewName="SwayForce")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.OscillationPeriod",NewName="SwayPeriod")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.PulseForce",NewName="SwayForce")
