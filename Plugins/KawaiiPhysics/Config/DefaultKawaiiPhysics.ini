[CoreRedirects]
; ProceduralWind パラメータ系列リネーム（v1.21.0 開発中の変更）: Oscillation -> Pulse / Envelope -> Breathing
; EnvelopeFrequency (Hz) -> BreathingPeriod (秒) は単位が変わるため意図的にリダイレクトしない。
; 旧アセットの値は破棄され既定値（ノード 10s / プリセット 20s）へフォールバックする。
; bOverrideEnvelopeFrequency も同様にリダイレクトしない（フラグだけ移送すると既定 Period を強制上書きしてしまうため）。
; FKawaiiPhysics_ExternalForce_ProceduralWind
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.OscillationForce",NewName="PulseForce")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.OscillationPeriod",NewName="PulsePeriod")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.EnvelopeMax",NewName="BreathingMax")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.EnvelopeMin",NewName="BreathingMin")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiPhysics_ExternalForce_ProceduralWind.EnvelopePhase",NewName="BreathingPhase")
; FKawaiiProceduralWindDynamicParams（値 + bOverride フラグ）
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.OscillationForce",NewName="PulseForce")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.OscillationPeriod",NewName="PulsePeriod")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.EnvelopeMax",NewName="BreathingMax")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.EnvelopeMin",NewName="BreathingMin")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.EnvelopePhase",NewName="BreathingPhase")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.bOverrideOscillationForce",NewName="bOverridePulseForce")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.bOverrideOscillationPeriod",NewName="bOverridePulsePeriod")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.bOverrideEnvelopeMax",NewName="bOverrideBreathingMax")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.bOverrideEnvelopeMin",NewName="bOverrideBreathingMin")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindDynamicParams.bOverrideEnvelopePhase",NewName="bOverrideBreathingPhase")
; FKawaiiProceduralWindPreset
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindPreset.OscillationForce",NewName="PulseForce")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindPreset.OscillationPeriod",NewName="PulsePeriod")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindPreset.EnvelopeMax",NewName="BreathingMax")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindPreset.EnvelopeMin",NewName="BreathingMin")
+PropertyRedirects=(OldName="/Script/KawaiiPhysics.KawaiiProceduralWindPreset.EnvelopePhase",NewName="BreathingPhase")
