[CoreRedirects]
; サンプルの AnimBlueprint に残る旧 MCP コメントノードを標準のコメントノードとして読む。
; 旧ノードは未リリースの型なので、配布物の利用者には要らない（BuildPlugin は Config を同梱しない）。
; 注意: このファイルのリダイレクトは配布物では効かない。リリース済みの名前を変えるときは、先に同梱の方法を決める。
+ClassRedirects=(OldName="/Script/KawaiiPhysicsEd.KawaiiPhysicsMcpCommentNode",NewName="/Script/UnrealEd.EdGraphNode_Comment")
