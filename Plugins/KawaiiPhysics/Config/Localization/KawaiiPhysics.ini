[CommonSettings]
SourcePath=Plugins/KawaiiPhysics/Content/Localization/KawaiiPhysics
DestinationPath=Plugins/KawaiiPhysics/Content/Localization/KawaiiPhysics
ManifestName=KawaiiPhysics.manifest
ArchiveName=KawaiiPhysics.archive
PortableObjectName=KawaiiPhysics.po
ResourceName=KawaiiPhysics.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ja

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/KawaiiPhysics/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
;WITH_EDITOR / WITH_EDITORONLY_DATA 内の LOCTEXT（Sequencer トラック名・チャンネル名・AnimNotify のアセット検証文言）も収集する
ShouldGatherFromEditorOnlyData=true

;Gather text from UPROPERTY reflection metadata (ProceduralWind + ExternalForce base)
[GatherTextStep1]
CommandletClass=GatherTextFromMetaData
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce_ProceduralWind.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/AnimNode_KawaiiPhysics.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/AnimNode_KawaiiPhysicsSharedPublisher.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsSharedPublisherTypes.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsTypes.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsSyncBone.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsCollisionLimits.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsBoneConstraintTypes.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsCustomExternalForce.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsLimitsDataAsset.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsBoneConstraintsDataAsset.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/KawaiiPhysicsWindPresetDataAsset.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce_Basic.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce_Curve.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce_Gravity.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce_Wind.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysicsSequencer/Public/MovieSceneKawaiiPhysicsSettingsMultiplierSection.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysicsSequencer/Public/MovieSceneKawaiiPhysicsSettingsMultiplierTrack.h
FieldTypesToExclude=Enum
FieldTypesToExclude=Function
FieldOwnerTypesToExclude=CollisionLimitDataBase
FieldOwnerTypesToExclude=SphericalLimitData
FieldOwnerTypesToExclude=CapsuleLimitData
FieldOwnerTypesToExclude=BoxLimitData
FieldOwnerTypesToExclude=PlanarLimitData
InputKeys=DisplayName
OutputNamespaces=UObjectDisplayNames
OutputKeys="{FieldPath}"
InputKeys=ToolTip
OutputNamespaces=UObjectToolTips
OutputKeys="{FieldPath}"
InputKeys=Category
OutputNamespaces=UObjectCategory
OutputKeys="{MetaDataValue}"
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep2]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep3]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
