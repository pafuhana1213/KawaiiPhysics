[CommonSettings]
SourcePath=Plugins/KawaiiPhysics/Content/Localization/KawaiiPhysics
DestinationPath=Plugins/KawaiiPhysics/Content/Localization/KawaiiPhysics
ManifestName=KawaiiPhysics.manifest
ArchiveName=KawaiiPhysics.archive
PortableObjectName=KawaiiPhysics.po
ResourceName=KawaiiPhysics.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ja

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/KawaiiPhysics/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

;Gather text from UPROPERTY reflection metadata (ProceduralWind + ExternalForce base)
[GatherTextStep1]
CommandletClass=GatherTextFromMetaData
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce.h
IncludePathFilters=Plugins/KawaiiPhysics/Source/KawaiiPhysics/Public/ExternalForces/KawaiiPhysicsExternalForce_ProceduralWind.h
FieldTypesToExclude=Enum
FieldTypesToExclude=Function
InputKeys=DisplayName
OutputNamespaces=UObjectDisplayNames
OutputKeys="{FieldPath}"
InputKeys=ToolTip
OutputNamespaces=UObjectToolTips
OutputKeys="{FieldPath}"
InputKeys=Category
OutputNamespaces=UObjectCategory
OutputKeys="{MetaDataValue}"
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep2]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep3]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
